name: "Nix Flake Check"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Run nix flake check
        run: nix flake check

      - name: Evaluate all NixOS configurations
        run: |
          for host in laptop desktop vm vm-minimal server raspberrypi iso; do
            echo "Evaluating nixosConfigurations.$host..."
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done
