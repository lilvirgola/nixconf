name: "Nix Flake Check"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run nix flake check
        run: nix flake check

      - name: Evaluate all NixOS configurations
        run: |
          for host in laptop desktop vm vm-minimal server raspberrypi iso; do
            echo "Evaluating nixosConfigurations.$host..."
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done
