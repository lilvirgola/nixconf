name: "Check Templates"

on:
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "lib/templates.nix"
      - ".github/workflows/check-templates.yml"
  pull_request:
    paths:
      - "templates/**"
      - "lib/templates.nix"
      - ".github/workflows/check-templates.yml"
  schedule:
    # Runs every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  check-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Evaluate all template devShells
        run: |
          rev=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          for flake in templates/*/flake.nix; do
            dir=$(dirname "$flake")
            echo "Evaluating $dir..."
            nix eval --no-write-lock-file --override-input nixpkgs "github:nixos/nixpkgs/$rev" "./$dir#devShells.x86_64-linux.default.drvPath"
          done
