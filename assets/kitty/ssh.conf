# ==============================================================================
# Kitty SSH Kitten Configuration (~/.config/kitty/ssh.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# Baseline Options
# ------------------------------------------------------------------------------
# Re-use existing connections to eliminate SSH handshake latency on subsequent logins
share_connections yes

# ------------------------------------------------------------------------------
# Dynamic Host Profiles (~/.config/kitty/ssh_hosts.conf)
# ------------------------------------------------------------------------------
# Host profiles are created interactively on first connection via 's <endpoint>'
# and persisted to ~/.config/kitty/ssh_hosts.conf (Standard Server vs Embedded/Router).
# Manage configured endpoints anytime with 's --list' or 's --edit'.
globinclude ssh_hosts.conf
