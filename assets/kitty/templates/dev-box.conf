# Description: Development Workstation / VM (remote kitten, tools, remote control)
# ------------------------------------------------------------------------------
# Full developer environment with Kitty remote control forwarding,
# truecolor terminal, editor setup, and full remote kitten features.
# ------------------------------------------------------------------------------
remote_kitty yes
shell_integration inherited
forward_remote_control yes

env COLORTERM=truecolor
env EDITOR=vim
env VISUAL=vim
env PAGER=less -RF
env ENV=${HOME}/.bash_aliases

copy --dest .bash_aliases ${HOME}/.config/kitty/remote_aliases.sh
copy --dest .kitten_remote_rc ${HOME}/.config/kitty/remote_aliases.sh
