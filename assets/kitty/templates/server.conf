# Description: Standard Linux Server / VM (remote kitten, aliases, truecolor)
# ------------------------------------------------------------------------------
# Deploys remote kitten binary on-demand, truecolor terminal capabilities,
# and curated shell aliases with system diagnostics.
# ------------------------------------------------------------------------------
remote_kitty if-needed
shell_integration inherited

env COLORTERM=truecolor
env EDITOR=vim
env VISUAL=vim
env PAGER=less -RF
env ENV=${HOME}/.bash_aliases

copy --dest .bash_aliases ${HOME}/.config/kitty/remote_aliases.sh
copy --dest .kitten_remote_rc ${HOME}/.config/kitty/remote_aliases.sh
